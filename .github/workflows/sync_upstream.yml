name: Sync upstream

on:
  schedule:
    - cron: '10 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sandbox
        uses: actions/checkout@v7
        with:
          # Shallow fetch, since this repo's `main` should be a pure mirror.
          fetch-depth: 1
          persist-credentials: true

      - name: Fast-forward main from upstream
        run: |
          git remote add upstream https://github.com/django/django.git
          git fetch upstream main
          git push origin upstream/main:refs/heads/main
